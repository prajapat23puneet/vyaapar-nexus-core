name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TESTCONTAINERS_RYUK_DISABLED: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      
    steps:
    - uses: actions/checkout@v4

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'pnpm'

    - name: Install Frontend Dependencies
      run: pnpm install --filter web
      
    - name: Build Frontend
      run: pnpm --filter web build
      env:
        VITE_API_URL: "https://placeholder.example.com"
        VITE_API_KEY: "ci-placeholder-key"

    - name: Restore Backend Dependencies
      run: dotnet restore apps/api/VyaaparNexus.slnx

    - name: Build Backend
      run: dotnet build apps/api/VyaaparNexus.slnx --no-restore -c Release

    - name: Test Backend
      run: dotnet test apps/api/VyaaparNexus.slnx --no-build -c Release --verbosity normal --logger trx

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/TestResults/**/*.trx'

