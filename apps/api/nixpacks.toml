[phases.setup]
nixPkgs = ["dotnet-sdk_8"]

[phases.install]
cmds = ["dotnet restore VyaaparNexus.API/VyaaparNexus.API.csproj"]

[phases.build]
cmds = ["dotnet publish VyaaparNexus.API/VyaaparNexus.API.csproj --no-restore -c Release -o /app/publish"]

[start]
cmd = "dotnet /app/publish/VyaaparNexus.API.dll"